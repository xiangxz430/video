# ============================================================
# Video Server Nginx 反向代理配置
# 部署到阿里云ECS时使用
# ============================================================
#
# 使用说明：
# 1. 将此文件复制到 /etc/nginx/conf.d/video-server.conf
#    或 include 到 /etc/nginx/nginx.conf 中
# 2. 将 server_name _ 替换为你的实际域名或ECS公网IP
# 3. 如需HTTPS，请参考下方注释配置Let's Encrypt
# 4. 执行 nginx -t 测试配置，然后 nginx -s reload 重载
# ============================================================

upstream video_server {
    server localhost:3000;
    keepalive 64;
}

server {
    # ⚠️ 请将 _ 替换为你的实际域名或ECS公网IP，例如：
    # server_name video.example.com;
    # server_name 47.100.xx.xx;
    server_name _;

    listen 80;

    # 请求体大小限制（视频/图片生成可能涉及较大payload）
    client_max_body_size 50M;

    # ---------- 通用反向代理 ----------
    location / {
        proxy_pass http://video_server;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ---------- SSE 流式响应专用路径 ----------
    # 视频/分镜生成接口使用SSE（Server-Sent Events），
    # 必须关闭缓冲以实现实时流式输出
    location ~ ^/api/(video/generate|storyboard/generate|script/split) {
        proxy_pass http://video_server;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键配置：关闭代理缓冲
        proxy_buffering off;
        proxy_cache off;

        # SSE 长连接超时（AI生成可能耗时较长）
        proxy_read_timeout 3600s;

        # 支持分块传输编码
        chunked_transfer_encoding on;

        # 禁用 gzip，避免流式响应被压缩导致客户端延迟接收
        gzip off;
    }

    # ---------- 静态资源（管理后台） ----------
    location /admin/ {
        proxy_pass http://video_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- HTTPS 配置说明（Let's Encrypt） ----------
    # 1. 安装 certbot：
    #    sudo apt install certbot python3-certbot-nginx
    #
    # 2. 自动获取证书并配置（会自动修改此配置文件）：
    #    sudo certbot --nginx -d your-domain.com
    #
    # 3. 自动续期已由 certbot timer 处理，可手动测试：
    #    sudo certbot renew --dry-run
    #
    # 配置完成后，Nginx会自动添加如下结构（无需手动添加）：
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ...其余配置与上方相同...
    # }
    #
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
